plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
def hasReleaseKeystore = keystorePropertiesFile.exists()
if (hasReleaseKeystore) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

def isCodemagic = System.getenv("CM_BUILD_ID") != null
def codemagicKeystorePath = System.getenv("CM_KEYSTORE_PATH")
def codemagicKeystorePassword = System.getenv("CM_KEYSTORE_PASSWORD")
def codemagicKeyAlias = System.getenv("CM_KEY_ALIAS")
def codemagicKeyPassword = System.getenv("CM_KEY_PASSWORD") ?: codemagicKeystorePassword
def hasCodemagicSigning = isCodemagic && codemagicKeystorePath && codemagicKeystorePassword && codemagicKeyAlias

android {
    namespace "de.freiraum.parking"
    compileSdk flutter.compileSdkVersion
    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId "de.freiraum.parking"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    signingConfigs {
        if (hasCodemagicSigning || hasReleaseKeystore) {
            release {
                if (hasCodemagicSigning) {
                    storeFile file(codemagicKeystorePath)
                    storePassword codemagicKeystorePassword
                    keyAlias codemagicKeyAlias
                    keyPassword codemagicKeyPassword
                } else {
                    keyAlias keystoreProperties["keyAlias"]
                    keyPassword keystoreProperties["keyPassword"] ?: keystoreProperties["storePassword"]
                    storeFile file(keystoreProperties["storeFile"])
                    storePassword keystoreProperties["storePassword"]
                }
            }
        }
    }

    buildTypes {
        release {
            if (isCodemagic && !(hasCodemagicSigning || hasReleaseKeystore)) {
                throw new GradleException(
                    "Codemagic Android signing credentials are unavailable. Re-save Android code signing in the Workflow Editor."
                )
            }

            // Never silently fall back to a debug key on Codemagic Store builds.
            // Local/GitHub diagnostic release builds may still use debug signing.
            if (hasCodemagicSigning || hasReleaseKeystore) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
    }
}

def freiraumIconSource = rootProject.file("../tool/app_icon_source.webp.b64")
def freiraumIconOutput = file("src/main/res/drawable/app_icon_source.webp")

tasks.register("prepareFreiraumAppIcon") {
    inputs.file(freiraumIconSource)
    outputs.file(freiraumIconOutput)
    doLast {
        if (!freiraumIconSource.exists()) {
            throw new GradleException("FREIRAUM app icon source is missing: ${freiraumIconSource}")
        }
        freiraumIconOutput.parentFile.mkdirs()
        freiraumIconOutput.bytes = java.util.Base64.getDecoder().decode(
            freiraumIconSource.getText("UTF-8").trim()
        )
    }
}

tasks.named("preBuild").configure {
    dependsOn("prepareFreiraumAppIcon")
}

flutter {
    source '../..'
}
