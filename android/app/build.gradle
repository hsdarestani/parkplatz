plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
def hasReleaseKeystore = keystorePropertiesFile.exists()
if (hasReleaseKeystore) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

def isCi = System.getenv("CI") == "true"
def codemagicSigningVariables = [
    "CM_KEYSTORE_PATH",
    "CM_KEYSTORE_PASSWORD",
    "CM_KEY_ALIAS",
    "CM_KEY_PASSWORD",
]
def hasCodemagicSigning = isCi && codemagicSigningVariables.every { System.getenv(it) }

android {
    namespace "de.freiraum.parking"
    compileSdk flutter.compileSdkVersion
    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId "de.freiraum.parking"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    signingConfigs {
        if (hasCodemagicSigning || hasReleaseKeystore) {
            release {
                if (hasCodemagicSigning) {
                    // Codemagic Workflow Editor exposes the configured Android
                    // signing identity through these environment variables.
                    storeFile file(System.getenv("CM_KEYSTORE_PATH"))
                    storePassword System.getenv("CM_KEYSTORE_PASSWORD")
                    keyAlias System.getenv("CM_KEY_ALIAS")
                    keyPassword System.getenv("CM_KEY_PASSWORD")
                } else {
                    keyAlias keystoreProperties["keyAlias"]
                    keyPassword keystoreProperties["keyPassword"]
                    storeFile file(keystoreProperties["storeFile"])
                    storePassword keystoreProperties["storePassword"]
                }
            }
        }
    }

    buildTypes {
        release {
            if (isCi && !hasCodemagicSigning) {
                throw new GradleException(
                    "CI release signing is not configured. Enable Android code signing in Codemagic."
                )
            }

            // CI must never silently fall back to a debug key. Local release
            // builds may still use the debug key when no private keystore is present.
            signingConfig (hasCodemagicSigning || hasReleaseKeystore) ? signingConfigs.release : signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}
