name: Android release check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'lib/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/android-release-check.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: parkplatz-android-release-check
  cancel-in-progress: false

jobs:
  build-android-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze Flutter sources
        continue-on-error: true
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        continue-on-error: true
        run: flutter test

      - name: Build release app bundle
        id: android_build
        continue-on-error: true
        run: |
          set -o pipefail
          flutter build appbundle --release \
            --build-name 0.9.2 \
            --build-number 3 \
            --dart-define=API_BASE_URL=https://parkplatz.smarbiz.sbs/api \
            --dart-define=ALLOW_LOCAL_BOOKING_FALLBACK=false \
            2>&1 | tee /tmp/android-build.log

      - name: Upload test AAB
        if: steps.android_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: freiraum-android-aab
          path: build/app/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Report Android build result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const ok = '${{ steps.android_build.outcome }}' === 'success';
            const raw = fs.existsSync('/tmp/android-build.log')
              ? fs.readFileSync('/tmp/android-build.log', 'utf8')
              : 'No Android build log was produced.';
            const tail = raw.split('\n').slice(-120).join('\n').slice(-12000);
            const body = ok
              ? '✅ Independent Android release check succeeded and produced an AAB.\n\n```text\n' + tail + '\n```'
              : '❌ Independent Android release check failed.\n\n```text\n' + tail + '\n```';
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 9,
              title: ok ? 'Android release check healthy' : 'Android release check failed',
              state: ok ? 'closed' : 'open',
              body: body + '\n\nWorkflow run: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId
            });

      - name: Enforce Android build result
        if: steps.android_build.outcome == 'failure'
        run: exit 1
