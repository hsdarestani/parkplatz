name: Pull Request Checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: parkplatz-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: freiraum
          POSTGRES_USER: freiraum
          POSTGRES_PASSWORD: freiraum
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U freiraum" --health-interval 5s
          --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://freiraum:freiraum@localhost:5432/freiraum
      JWT_SECRET: pull-request-only-secret
      PAYMENT_MODE: direct
      PUBLIC_APP_URL: http://localhost:8080
      RECEIPT_UPLOAD_DIR: /tmp/freiraum/receipts
      MARKETPLACE_UPLOAD_DIR: /tmp/freiraum/marketplace-media
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend and audit tools
        run: pip install -e '.[test]' pip-audit
      - name: Freeze auditable dependencies
        run: pip freeze --exclude-editable > ../audit-requirements.txt
      - name: Record Python dependency audit
        run: |
          set +e
          pip-audit --strict -r ../audit-requirements.txt --format=json \
            2>&1 | tee ../pip-audit.json
          exit 0
      - name: Upload dependency audit
        uses: actions/upload-artifact@v4
        with:
          name: backend-dependency-audit
          path: |
            pip-audit.json
            audit-requirements.txt
          if-no-files-found: error
      - name: Lint backend
        run: |
          set +e
          ruff check app tests 2>&1 | tee ../ruff.log
          exit ${PIPESTATUS[0]}
      - name: Upload lint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-lint-diagnostics
          path: ruff.log
          if-no-files-found: error
      - name: Run database migrations
        run: |
          set +e
          alembic upgrade heads 2>&1 | tee ../alembic-upgrade.log
          exit ${PIPESTATUS[0]}
      - name: Upload migration diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-migration-diagnostics
          path: alembic-upgrade.log
          if-no-files-found: warn
      - run: python -m app.db.seed && python -m app.db.seed
      - name: Run backend tests with coverage
        run: |
          set +e
          pytest --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml \
            --cov-fail-under=35 2>&1 | tee ../pytest.log
          exit ${PIPESTATUS[0]}
      - name: Start API and run process-level smoke checks
        run: |
          set -euo pipefail
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../uvicorn.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/api/health > ../health.json; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8000/api/parking-spaces > ../spaces.json
          python - <<'PY'
          import json
          from pathlib import Path

          health = json.loads(Path('../health.json').read_text())
          spaces = json.loads(Path('../spaces.json').read_text())
          assert health['status'] == 'ok', health
          assert health['database'] == 'connected', health
          assert isinstance(spaces, list) and spaces, spaces
          for space in spaces:
              assert 'exact_address' not in space
              assert 'entrance_instructions' not in space
          print(f'API smoke passed with {len(spaces)} public spaces.')
          PY
      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: warn
      - name: Upload backend diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-diagnostics
          path: |
            ruff.log
            pytest.log
            uvicorn.log
            health.json
            spaces.json
          if-no-files-found: warn
      - name: Build backend image
        working-directory: .
        run: docker build -t freiraum-api-pr:${GITHUB_SHA} backend
      - name: Enforce backend dependency security gate
        run: pip-audit --strict -r ../audit-requirements.txt

  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - name: Resolve Flutter dependencies
        run: |
          set +e
          flutter pub get 2>&1 | tee flutter-pub-get.log
          exit ${PIPESTATUS[0]}
      - name: Report dependency freshness
        run: dart pub outdated --no-dependency-overrides
      - run: dart format --output=none lib test
      - name: Analyze Flutter
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee flutter-analyze.log
          exit ${PIPESTATUS[0]}
      - name: Run Flutter tests with coverage
        run: |
          set +e
          flutter test --coverage 2>&1 | tee flutter-test.log
          exit ${PIPESTATUS[0]}
      - name: Summarize Flutter coverage
        run: |
          python3 - <<'PY'
          from pathlib import Path

          found = hit = 0
          for line in Path('coverage/lcov.info').read_text().splitlines():
              if line.startswith('LF:'):
                  found += int(line[3:])
              elif line.startswith('LH:'):
                  hit += int(line[3:])
          percent = 100.0 * hit / found if found else 0.0
          print(f'Flutter line coverage: {hit}/{found} ({percent:.2f}%)')
          if percent < 40:
              raise SystemExit('Flutter coverage dropped below the 40% production baseline.')
          PY
      - name: Upload Flutter coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: coverage/lcov.info
          if-no-files-found: warn
      - name: Upload Flutter diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-diagnostics
          path: |
            flutter-pub-get.log
            flutter-analyze.log
            flutter-test.log
          if-no-files-found: warn
      - name: Build Flutter Web
        run: >-
          flutter build web --release --base-href / --pwa-strategy=none
          --dart-define=API_BASE_URL=/api
          --dart-define=ALLOW_LOCAL_BOOKING_FALLBACK=false

  android-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate complete Android platform scaffold
        run: |
          rm -rf /tmp/parking
          flutter create --platforms=android --org de.freiraum --project-name parking /tmp/parking
          rm -rf android
          cp -R /tmp/parking/android android
      - run: flutter pub get
      - name: Validate Android identity and permissions
        run: |
          grep --recursive --fixed-strings 'de.freiraum.parking' android/app
          grep --fixed-strings 'android.permission.ACCESS_FINE_LOCATION' android/app/src/main/AndroidManifest.xml || \
            sed -i '/<manifest/a\    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />' android/app/src/main/AndroidManifest.xml
      - name: Build Android App Bundle
        run: |
          set +e
          flutter build appbundle --release \
            --dart-define=API_BASE_URL=https://parkplatz.smarbiz.sbs/api \
            --dart-define=ALLOW_LOCAL_BOOKING_FALLBACK=false \
            2>&1 | tee android-build.log
          exit ${PIPESTATUS[0]}
      - name: Upload Android release candidate and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-release-candidate
          path: |
            build/app/outputs/bundle/release/app-release.aab
            android-build.log
            android
          if-no-files-found: error

  ios-release:
    runs-on: macos-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate complete iOS platform scaffold
        run: |
          rm -rf /tmp/parking
          flutter create --platforms=ios --org de.freiraum --project-name parking /tmp/parking
          rm -rf ios
          cp -R /tmp/parking/ios ios
          /usr/libexec/PlistBuddy -c 'Set :CFBundleDisplayName FREIRAUM' ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c 'Add :NSLocationWhenInUseUsageDescription string FREIRAUM nutzt deinen Standort nur auf Wunsch, um Stellplätze in deiner Nähe vorzuschlagen.' ios/Runner/Info.plist
      - run: flutter pub get
      - name: Validate iOS identity and privacy description
        run: |
          grep --recursive --fixed-strings 'de.freiraum.parking' ios/Runner.xcodeproj/project.pbxproj
          /usr/libexec/PlistBuddy -c 'Print :NSLocationWhenInUseUsageDescription' ios/Runner/Info.plist
      - name: Build iOS release without signing
        run: >-
          flutter build ios --release --no-codesign
          --dart-define=API_BASE_URL=https://parkplatz.smarbiz.sbs/api
          --dart-define=ALLOW_LOCAL_BOOKING_FALLBACK=false
      - uses: actions/upload-artifact@v4
        with:
          name: ios-release-candidate
          path: |
            build/ios/iphoneos/Runner.app
            ios
          if-no-files-found: error
