name: Build and Upload FREIRAUM to Google Play

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Unique Android versionCode'
        required: true
        default: '10'
      track:
        description: 'Google Play track'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      upload_to_play:
        description: 'Upload the signed AAB to Google Play'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: parkplatz-android-play
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      APP_VERSION: '1.0.0'
      BUILD_NUMBER: ${{ inputs.build_number }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}

    steps:
      - name: Verify required signing secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

          if [ "${{ inputs.upload_to_play }}" = "true" ]; then
            test -n "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON"
          fi

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Restore Android upload keystore
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/freiraum-upload-keystore.jks"

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"

          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=$KEYSTORE_PATH
          EOF

          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build signed Android App Bundle
        shell: bash
        run: |
          set -euo pipefail
          flutter build appbundle \
            --release \
            --build-name="$APP_VERSION" \
            --build-number="$BUILD_NUMBER" \
            --dart-define=API_BASE_URL=https://parkplatz.smarbiz.sbs/api \
            --dart-define=ALLOW_LOCAL_BOOKING_FALLBACK=false \
            --dart-define=SOCIAL_AUTH_UI_ENABLED=false

          AAB_PATH="$GITHUB_WORKSPACE/build/app/outputs/bundle/release/app-release.aab"
          test -f "$AAB_PATH"
          echo "AAB_PATH=$AAB_PATH" >> "$GITHUB_ENV"

      - name: Verify AAB signature
        shell: bash
        run: |
          set -euo pipefail
          jarsigner -verify "$AAB_PATH"
          keytool -printcert -jarfile "$AAB_PATH"

      - name: Upload signed AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: freiraum-android-${{ env.APP_VERSION }}-${{ env.BUILD_NUMBER }}
          path: ${{ env.AAB_PATH }}
          retention-days: 14
          if-no-files-found: error

      - name: Upload AAB to Google Play
        if: ${{ inputs.upload_to_play }}
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: de.freiraum.parking
          releaseFiles: ${{ env.AAB_PATH }}
          tracks: ${{ inputs.track }}
          status: completed
          releaseName: FREIRAUM ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }})
